{{- if .Values.martin.enabled }}
{{- $fullname := include "mastr-tool.fullname" . -}}
{{- $m := .Values.martin -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-martin
  labels:
    {{- include "mastr-tool.labels" . | nindent 4 }}
    app.kubernetes.io/component: martin
spec:
  type: {{ $m.service.type }}
  ports:
    - name: http
      port: {{ $m.service.port }}
      targetPort: {{ $m.containerPort }}
  selector:
    app.kubernetes.io/name: {{ include "mastr-tool.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: martin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-martin
  labels:
    {{- include "mastr-tool.labels" . | nindent 4 }}
    app.kubernetes.io/component: martin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mastr-tool.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: martin
  template:
    metadata:
      labels:
        {{- include "mastr-tool.labels" . | nindent 8 }}
        app.kubernetes.io/component: martin
    spec:
      # the Martin image has no USER directive and runs as root
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $m.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $m.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $m.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      # Martin retries the first database connection for 30s, so in standalone
      # mode wait for Postgres readiness first.
      {{- if eq .Values.database.mode "standalone" }}
      initContainers:
        - name: wait-for-db
          image: "{{ .Values.database.standalone.image.repository }}:{{ .Values.database.standalone.image.tag }}"
          command:
            - sh
            - -c
            - "until pg_isready -h {{ include "mastr-tool.dbHost" . }} -p {{ .Values.database.port | default 5432 }} -U {{ include "mastr-tool.dbUser" . }} -d {{ include "mastr-tool.dbName" . }}; do sleep 5; done"
      {{- end }}
      containers:
        - name: martin
          image: "{{ $m.image.repository }}:{{ $m.image.tag }}"
          {{- with $m.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          args:
            - --config
            - /etc/martin/config.yaml
          env:
            - name: TILES_DB_PASSWORD
              value: {{ $m.dbPassword | quote }}
            # read-only role created by mastr-tool (import_mastr.py)
            - name: MARTIN_DATABASE_URL
              value: "postgresql://tiles_reader:$(TILES_DB_PASSWORD)@{{ include "mastr-tool.dbHost" . }}:{{ .Values.database.port | default 5432 }}/{{ include "mastr-tool.dbName" . }}"
            # overrides listen_addresses from the config file
            - name: MARTIN_LISTEN_ADDRESSES
              value: "0.0.0.0:{{ $m.containerPort }}"
          ports:
            - name: http
              containerPort: {{ $m.containerPort }}
          volumeMounts:
            - name: config
              mountPath: /etc/martin
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          {{- with $m.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}-martin
{{- end }}
