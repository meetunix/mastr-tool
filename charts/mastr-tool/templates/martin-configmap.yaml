{{- if .Values.martin.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mastr-tool.fullname" . }}-martin
  labels:
    {{- include "mastr-tool.labels" . | nindent 4 }}
    app.kubernetes.io/component: martin
data:
  # same file as martin/config.yaml in the repository root
  config.yaml: |
    {{- .Files.Get "files/martin.yaml" | nindent 4 }}
{{- end }}
