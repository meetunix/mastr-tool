{{- $fullname := include "mastr-tool.fullname" . -}}
{{- $mt := .Values.mastrTool -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "mastr-tool.labels" . | nindent 4 }}
    app.kubernetes.io/component: mastr-tool
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mastr-tool.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mastr-tool
  template:
    metadata:
      labels:
        {{- include "mastr-tool.labels" . | nindent 8 }}
        app.kubernetes.io/component: mastr-tool
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $mt.podSecurityContext | nindent 8 }}
      {{- with $mt.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $mt.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $mt.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      # In standalone mode wait for Postgres readiness; in cnpg mode
      # the DB is assumed available (or use an initContainer probe).
      {{- if eq .Values.database.mode "standalone" }}
      initContainers:
        - name: wait-for-db
          image: "{{ .Values.database.standalone.image.repository }}:{{ .Values.database.standalone.image.tag }}"
          command:
            - sh
            - -c
            - "until pg_isready -h {{ include "mastr-tool.dbHost" . }} -p {{ .Values.database.port | default 5432 }} -U {{ include "mastr-tool.dbUser" . }} -d {{ include "mastr-tool.dbName" . }}; do sleep 5; done"
      {{- end }}
      containers:
        - name: mastr-tool
          image: "{{ $mt.image.repository }}:{{ $mt.image.tag | default .Chart.AppVersion }}"
          {{- with $mt.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          env:
            - name: MASTR_FORCE_USING_EXISTING_DUMP
              value: {{ $mt.forceUsingExistingDump | quote }}
            # DB connection (consumed by db/db_utils.py:get_db_connection).
            - name: DB_HOST
              value: {{ include "mastr-tool.dbHost" . | quote }}
            - name: DB_PORT
              value: {{ .Values.database.port | default 5432 | quote }}
            - name: DB_NAME
              value: {{ include "mastr-tool.dbName" . | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "mastr-tool.dbSecretName" . }}
                  key: {{ .Values.database.existingSecretUserKey }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mastr-tool.dbSecretName" . }}
                  key: {{ .Values.database.existingSecretPasswordKey }}
            {{- with $mt.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: cache
              mountPath: /mastr/cache
            - name: output
              mountPath: /mastr/output
          {{- with $mt.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: {{ $fullname }}-cache
        - name: output
          persistentVolumeClaim:
            claimName: {{ $fullname }}-output
