{{/*
Database Secret.

Created only when database.mode=standalone, OR when cnpg mode has no
existingSecret set and a password is provided. In cnpg mode without a
password the user is expected to supply their own Secret (existingSecret).
*/}}
{{- $mode := .Values.database.mode -}}
{{- $createSecret := false -}}
{{- if eq $mode "standalone" }}
{{- $createSecret = true -}}
{{- else if and (eq $mode "cnpg") (not .Values.database.existingSecret) .Values.database.password }}
{{- $createSecret = true -}}
{{- end }}
{{- if $createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mastr-tool.dbSecretName" . }}
  labels:
    {{- include "mastr-tool.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ include "mastr-tool.dbUser" . | quote }}
  password: {{ if eq $mode "standalone" }}{{ .Values.database.standalone.password | quote }}{{ else }}{{ .Values.database.password | quote }}{{ end }}
{{- end }}
