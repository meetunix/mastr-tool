# mastr-tool Helm chart values
#
# Mirrors docker-compose.yaml: mastr-tool + mastr-static + db.
# (mastr-app is a separate repository and gets its own chart.)
# All images are pulled from Docker Hub (nachtsieb/mastr-*).

# --- global image / naming ---
nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

# --- mastr-tool (backend scheduler: download -> import incl. UTM enrichment -> export) ---
mastrTool:
  image:
    repository: nachtsieb/mastr-tool
    tag: ""
  # Run as non-root (matches compose `user: 1000:1000`).
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  # Force using an existing dump instead of downloading (one-shot pipeline run;
  # the pod stays idle afterwards instead of exiting, so it is not restarted).
  forceUsingExistingDump: false
  # Skip database import (incl. UTM enrichment) and export completely.
  skipImportAndExport: false
  # Parallel processes for import and export ("" = CPU cores minus one).
  concurrency: ""
  # Extra env vars appended to the container.
  extraEnv: []
  resources: {}
    # requests: { cpu: "1", memory: "2Gi" }
    # limits:   { cpu: "2", memory: "4Gi" }
  nodeSelector: {}
  tolerations: []
  affinity: {}

# --- mastr-static (httpd serving the exported files) ---
mastrStatic:
  enabled: true
  image:
    repository: nachtsieb/mastr-static
    tag: ""
  # Port the container listens on (httpd configured to 8080).
  containerPort: 8080
  service:
    type: ClusterIP
    port: 8080
  # Ingress exposing the exported files. Set enabled: true and configure host/path.
  ingress:
    enabled: false
    className: ""                 # e.g. nginx, traefik
    annotations: {}
    hosts:
      - host: mastr-static.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
      # - secretName: mastr-static-tls
      #   hosts: [mastr-static.local]
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# --- Martin (Mapbox Vector Tiles of the units with coordinates) ---
# Serves the function sources from db/tiles.sql live from the database, see
# the README. The read-only role tiles_reader is created by mastr-tool.
# The Martin configuration itself is files/martin.yaml (cache, Cache-Control,
# published schemas); only the connection and the port are set here.
martin:
  enabled: true
  image:
    repository: ghcr.io/maplibre/martin
    tag: "1.16.1"
  # Port the container listens on. It is passed to Martin as
  # MARTIN_LISTEN_ADDRESSES, so it overrides listen_addresses in the config.
  containerPort: 7800
  # Password of the read-only role tiles_reader. mastr-tool creates the role
  # with this password, Martin connects with it. Change it for a public
  # deployment; it must not contain URL special characters.
  dbPassword: tiles
  service:
    type: ClusterIP
    port: 7800
  # Ingress exposing the tiles. Set enabled: true and configure host/path.
  ingress:
    enabled: false
    className: ""                 # e.g. nginx, traefik
    annotations: {}
    hosts:
      - host: mastr-tiles.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
      # - secretName: mastr-tiles-tls
      #   hosts: [mastr-tiles.local]
  # The tile cache in files/martin.yaml is configured for 512 MiB, so a memory
  # limit must leave headroom above that (e.g. 1024Mi).
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# --- database ---
# mode controls how the chart provisions / addresses Postgres:
#   standalone : chart deploys its own Postgres StatefulSet (mirrors compose `db`).
#   cnpg       : chart deploys NO db pod; point at an existing CloudNativePG Cluster
#                via database.host (the -rw service) and database.user/secret.
database:
  mode: standalone
  port: 5432
  # Used by cnpg mode (ignored for standalone).
  host: ""
  name: mastr
  user: mastr
  password: ""
  # Name of an existing Secret with keys `username` and `password`.
  # If set, the chart will NOT create its own Secret and will use this one.
  existingSecret: ""
  # Key names inside the Secret (defaults match common conventions).
  existingSecretUserKey: username
  existingSecretPasswordKey: password

  # standalone-mode Postgres.
  standalone:
    image:
      # PostGIS variant of the official image: the tile functions (db/tiles.sql)
      # and the GiST indices on the unit tables need the extension. The image
      # is built on the official postgres image, the existing data directory
      # keeps working (no dump and restore needed).
      repository: postgis/postgis
      tag: "18-3.6"
    user: mastr
    password: password
    name: mastr
    # initdb locale args (mirrors compose POSTGRES_INITDB_ARGS).
    initdbArgs: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    # PGDATA is hardcoded to /var/lib/postgresql/data/pgdata in the template
    # to avoid the "lost+found" issue when mounting PVCs directly to PGDATA.
    storage: 50Gi
    storageClassName: ""
    # Postgres tuning flags (mirrors the `command:` block in compose).
    postgresqlParams:
      # small WAL footprint: 256MB ceiling keeps pg_wal to a few hundred MB
      max_wal_size: 256MB
      checkpoint_timeout: 15min
      checkpoint_completion_target: "0.9"
      wal_buffers: 16MB
      wal_compression: "lz4"
      shared_buffers: 256MB
      synchronous_commit: "off"
      bgwriter_lru_maxpages: "200"
      bgwriter_delay: 50ms
      # read path for Martin, tuned for a 3 GiB box (docs/technical.md)
      effective_cache_size: 1536MB
      random_page_cost: "1.1"
      max_parallel_workers_per_gather: "0"
      max_parallel_maintenance_workers: "0"
    resources: {}
      # requests: { cpu: "500m", memory: "1Gi" }
    nodeSelector: {}
    tolerations: []
    affinity: {}

# --- persistence for cache + output (shared by mastr-tool and mastr-static) ---
persistence:
  # MASTR_CACHE_DIR: dump, extracted XML. Needs >= 70 GiB per README.
  cache:
    size: 80Gi
    storageClassName: ""
    accessModes: [ReadWriteOnce]
  # MASTR_OUTPUT_DIR: CSV / Parquet / Excel exports.
  output:
    size: 20Gi
    storageClassName: ""
    # ReadWriteMany recommended so mastr-static can read exports written by mastr-tool
    # when they land on different nodes. With ReadWriteOnce, co-locate via affinity.
    accessModes: [ReadWriteMany]
