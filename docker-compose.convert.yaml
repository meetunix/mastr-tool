services:

  mastr-tool:
    pull_policy: if_not_present
    image: mastr-tool:latest
    build: .
    container_name: mastr-tool
    # "on-failure": failures are retried; a successful one-shot run
    # (MASTR_FORCE_USING_EXISTING_DUMP) stays idle and is not restarted
    restart: on-failure
    user: 1000:1000
    environment:
      MASTR_FORCE_USING_EXISTING_DUMP: "true"
      MASTR_SKIP_IMPORT_AND_EXPORT: "false" # skip import (incl. UTM enrichment) and export completely
    volumes:
      - ${MASTR_CACHE_DIR}:/mastr/cache
      - ${MASTR_OUTPUT_DIR}:/mastr/output
    depends_on:
      db:
        condition: service_healthy

  db:
    image: docker.io/postgres:18
    restart: unless-stopped
    container_name: mastr-db
    environment:
      - POSTGRES_USER=mastr
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mastr
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
      - PGDATA=/var/lib/postgresql/18/data
    # small WAL footprint: 128MB ceiling, 32MB recycling floor and no
    # recycled-segment pool, so pg_wal stays well under 300MB
    command: >
      postgres
      -c max_wal_size=128MB
      -c min_wal_size=32MB
      -c wal_recycle=off
      -c checkpoint_timeout=15min
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c wal_compression=lz4
      -c shared_buffers=256MB
      -c synchronous_commit=off
      -c bgwriter_lru_maxpages=200
      -c bgwriter_delay=50ms
    volumes:
      - mastr-database:/var/lib/postgresql/18/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mastr -d mastr" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mastr-database:
