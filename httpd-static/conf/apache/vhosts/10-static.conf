<VirtualHost *:8080>

    ServerName mastr-static
    DocumentRoot "/var/www/mastr-output"
    DeflateCompressionLevel 1

    <FilesMatch "\.(csv)$">
        SetOutputFilter DEFLATE
    </FilesMatch>

    # the database dump is a binary pg_dump archive despite its .sql name -
    # force the download content type (mime.types maps .sql to application/sql)
    <FilesMatch "\.sql$">
        ForceType application/octet-stream
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

</VirtualHost>
