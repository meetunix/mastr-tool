services:

  mastr-tool:
    pull_policy: if_not_present
    image: mastr-tool:latest
    build: .
    container_name: mastr-tool
    # a successful one-shot run (MASTR_FORCE_USING_EXISTING_DUMP) does not
    # exit but stays idle, so it is not restarted; failures are retried
    restart: unless-stopped
    user: 1000:1000
    environment:
      MASTR_FORCE_USING_EXISTING_DUMP: "${MASTR_FORCE_USING_EXISTING_DUMP:-false}" # use existing dump and do not download
      MASTR_SKIP_IMPORT_AND_EXPORT: "${MASTR_SKIP_IMPORT_AND_EXPORT:-false}" # skip import (incl. UTM enrichment) and export completely
      MASTR_CONCURRENCY: "${MASTR_CONCURRENCY:-}" # parallel processes for import and export (empty = CPU cores minus one)
      TILES_DB_PASSWORD: "${TILES_DB_PASSWORD:-tiles}" # password of the read-only role for Martin
      MARTIN_URL: "http://martin:7800" # tile cache is purged after the import
    volumes:
      - ${MASTR_CACHE_DIR}:/mastr/cache
      - ${MASTR_OUTPUT_DIR}:/mastr/output
    depends_on:
      db:
        condition: service_healthy

  mastr-static:
    pull_policy: if_not_present
    image: mastr-static:latest
    build: httpd-static
    container_name: mastr-static
    restart: unless-stopped
    volumes:
      - ${MASTR_OUTPUT_DIR}:/var/www/mastr-output/:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - mastr-tool

  db:
    # PostGIS variant of the official image: the tile functions (db/tiles.sql)
    # and the GiST indices on the unit tables need the extension. The image is
    # built on the official postgres image, the existing data directory keeps
    # working (no dump and restore needed).
    image: docker.io/postgis/postgis:18-3.6
    restart: unless-stopped
    container_name: mastr-db
    environment:
      - POSTGRES_USER=mastr
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mastr
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
      - PGDATA=/var/lib/postgresql/18/data
    # small WAL footprint: 256MB ceiling keeps pg_wal to a few hundred MB
    command: >
      postgres
      -c max_wal_size=256MB
      -c checkpoint_timeout=15min
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c wal_compression=lz4
      -c shared_buffers=256MB
      -c synchronous_commit=off
      -c bgwriter_lru_maxpages=200
      -c bgwriter_delay=50ms
    volumes:
      - mastr-database:/var/lib/postgresql/18/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mastr -d mastr" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Mapbox Vector Tiles (MVT) of the units with coordinates, served live from
  # the database by Martin. The layers are the functions in db/tiles.sql, the
  # connection uses the read-only role created by mastr-tool.
  #   http://127.0.0.1:8082/health                  health check
  #   http://127.0.0.1:8082/catalog                 list of layers
  #   http://127.0.0.1:8082/tiles.wind              TileJSON of one layer
  #   http://127.0.0.1:8082/tiles.wind/{z}/{x}/{y}  the tile
  martin:
    pull_policy: if_not_present
    image: ghcr.io/maplibre/martin:1.16.1
    container_name: mastr-martin
    restart: unless-stopped
    command: [ "--config", "/etc/martin/config.yaml" ]
    environment:
      MARTIN_DATABASE_URL: postgresql://tiles_reader:${TILES_DB_PASSWORD:-tiles}@db:5432/mastr
    volumes:
      - ./martin/config.yaml:/etc/martin/config.yaml:ro
    ports:
      - "127.0.0.1:8082:7800"
    healthcheck:
      # the image's built-in check uses Martin's default port 3000
      test: [ "CMD-SHELL", "wget --spider -q http://127.0.0.1:7800/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  # MaStR WebUI
  mastr-app:
    pull_policy: if_not_present
    image: mastr-app:latest
    build: ../mastr-app
    container_name: mastr-app
    restart: unless-stopped
    environment:
      MASTR_STATIC_URL: http://mastr-static:8080
      MASTR_STATIC_PUBLIC_URL: ${MASTR_STATIC_PUBLIC_URL}
      # read-only access to the database for the maps page
      DB_HOST: db
      DB_USER: mastr
      DB_PASSWORD: password
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - mastr-static
      - db

volumes:
  mastr-database: